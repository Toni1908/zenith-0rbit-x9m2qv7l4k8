

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cache</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&display=swap');

  * { box-sizing: border-box; }
  body {
    margin: 0;

  .brand {

  .brand-name {

  .month-nav {

  .month-nav button {

  }
  .month-nav button:hover { background: #202020; }
  .month-nav button:disabled { opacity: 0.3; cursor: default; }
  .month-title { font-size: 18px; font-weight: 600; letter-spacing: 0.3px; }
  .month-sub { font-size: 12px; color: #8a8a8a; margin-top: 2px; }

  .balance-card {
    background: linear-gradient(180deg, #141414, #0f0f0f);
    border: 1px solid #262626;

  }
  .balance-label { font-size: 12px; color: #8a8a8a; text-transform: uppercase; letter-spacing: 1px; }
  .balance-value { font-size: 30px; font-weight: 700; margin-top: 6px; }
  .balance-value.neg { color: #e2574f; }
  .balance-value.pos { color: #f2f2f2; }

  .stat-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .stat {
    flex: 1;
    background: #121212;
    border: 1px solid #232323;

  .stat-value.debit { color: #e2574f; }

  .section-label {
    font-size: 12px;

  .chart-card {
    background: #121212;

  }
  .chart-empty {

  .trend-legend {

    padding-top: 12px;

  .trend-legend-item {

  .add-form {

    border: 1px solid #232323;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .type-toggle { display: flex; gap: 8px; margin-bottom: 12px; }
  .type-btn {
    flex: 1;
    padding: 9px 0;
    border-radius: 8px;
    border: 1px solid #2a2a2a;
    background: #161616;
    color: #8a8a8a;

  .type-btn.active-debit { background: rgba(226,87,79,0.12); border-color: #e2574f; color: #e2574f; }
  .type-btn.active-transfer { background: rgba(167,139,250,0.12); border-color: #a78bfa; color: #a78bfa; }

  .add-form input, .add-form select {

  .submit-btn {

    font-weight: 700;
    letter-spacing: 0.3px;

  .balance-card { cursor: pointer; transition: border-color 0.15s; }

  .accounts-head {

    align-items: center;
    justify-content: space-between;

  }

    background: none;

    color: #666;

    letter-spacing: 0.5px;

  .accounts-scroll {

  }

  .account-chip-card {

    border: 1px solid #232323;

  }
  .account-row {
    display: flex;
    align-items: center;

  .account-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .account-name-input {
    flex: 1;
    background: #0d0d0d;
    border: 1px solid #262626;

    color: #f2f2f2;

    font-size: 13px;

    background: #0d0d0d;
    border: 1px solid #262626;
    border-radius: 6px;
    color: #f2f2f2;
    font-family: inherit;
    font-size: 13px;
    padding: 8px 10px;

  .account-add-row input:focus { outline: none; border-color: #444; }
  .account-add-row button {
    background: #1c1c1c;
    border: 1px solid #2a2a2a;
    color: #f2f2f2;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
  }

  .select-row { display: flex; gap: 8px; }
  .select-row select { flex: 1; margin-bottom: 10px; }

  .entry-account-select {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.3px;
    padding: 0;
    cursor: pointer;
    -webkit-appearance: none;

  .entry {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #121212;
    border: 1px solid #1e1e1e;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .entry-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .entry-reason { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 190px; }

  .entry-cat-tag {
    font-size: 10px;
    padding: 1px 7px;

  }
  .entry-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .entry-amount { font-size: 15px; font-weight: 600; }
  .entry-amount.credit { color: #4fd68c; }
  .entry-amount.debit { color: #e2574f; }
  .del-btn {
    background: none;
    border: none;
    color: #555;
    font-size: 16px;
    cursor: pointer;
    padding: 2px 4px;
  }
  .del-btn:hover { color: #e2574f; }

  .empty {
    text-align: center;
    color: #666;
    font-size: 13px;
    padding: 30px 0;
  }

  .status { font-size: 11px; color: #555; text-align: center; margin-top: 20px; }

  .export-row { display: flex; gap: 8px; margin-top: 16px; }

    background: #161616;
    border: 1px solid #2a2a2a;
    color: #8a8a8a;

  .export-row button:hover { color: #f2f2f2; border-color: #444; }

  /* ===== shared polish ===== */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  body { animation: fadeInUp 0.35s ease; }
  body {
    padding-top: calc(env(safe-area-inset-top, 0px));
    padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px));
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #333; }
  * { scrollbar-width: thin; scrollbar-color: #262626 transparent; }

  button, a.card, .card {
    transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease, color 0.15s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.96); }
  a.card:active, .card:active { transform: scale(0.98); }

  .toast-wrap {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    pointer-events: none;
  }
  .toast {
    background: #161616;
    border: 1px solid #2a2a2a;
    color: #eee;
    font-size: 12px;
    font-weight: 500;
    padding: 9px 16px;
    border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.err { border-color: #e2574f; color: #f2a09c; }

</style>

<body>
<div class="app">

  <a class="back-link" href="index.html">&#8592; Hub</a>

  <div class="brand">
    <div class="brand-name">Cache</div>
    <div class="brand-tag">monthly ledger</div>
  </div>

  <div class="month-nav">
    <button id="prevBtn">&#8592;</button>
    <div style="text-align:center;">
      <div class="month-title" id="monthTitle">—</div>
      <div class="month-sub" id="monthSub"></div>
    </div>
    <button id="nextBtn">&#8594;</button>
  </div>

  <div class="balance-card" id="overallCard">
    <div class="balance-label" id="balanceLabel">Overall balance</div>
    <div class="balance-value" id="closingBalance">₹0.00</div>
  </div>

  <div class="accounts-head">
    <div class="section-label" style="margin:0;">Accounts</div>
    <button class="manage-toggle" id="manageToggle" type="button">Manage</button>
  </div>
  <div class="accounts-scroll" id="accountsScroll"></div>

  <div class="manage-panel" id="managePanel" style="display:none;">
    <div id="accountRows"></div>
    <div class="account-add-row">
      <input type="text" id="newAccountName" placeholder="New account name">
      <button id="addAccountBtn" type="button">+ Add</button>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat">
      <div class="stat-label">Opening</div>
      <div class="stat-value opening" id="openingStat">₹0.00</div>
    </div>
    <div class="stat">
      <div class="stat-label">In</div>
      <div class="stat-value credit" id="creditStat">₹0.00</div>
    </div>
    <div class="stat">
      <div class="stat-label">Out</div>
      <div class="stat-value debit" id="debitStat">₹0.00</div>
    </div>
  </div>

  <div class="section-label">Money in &amp; out by category</div>
  <div class="chart-card" id="chartCard"></div>

  <div class="section-label">3-month spend trend</div>
  <div class="chart-card" id="trendCard"></div>

  <div class="add-form">
    <div class="type-toggle">
      <button class="type-btn active-credit" id="creditBtn" type="button">+ Credit</button>
      <button class="type-btn" id="debitBtn" type="button">− Debit</button>
      <button class="type-btn" id="transferBtn" type="button">&#8644; Transfer</button>
    </div>
    <input type="number" id="amountInput" placeholder="Amount (e.g. 152.35)" inputmode="decimal" step="0.01">
    <div class="select-row" id="normalFields">
      <select id="accountInput"></select>
      <select id="categoryInput">
        <option value="Food">Food</option>
        <option value="Fuel">Fuel</option>
        <option value="Salary">Salary</option>
        <option value="Bills">Bills</option>
        <option value="Other expenses">Other expenses</option>
      </select>
    </div>
    <div class="select-row" id="transferFields" style="display:none;">
      <select id="fromAccountInput"></select>
      <select id="toAccountInput"></select>
    </div>
    <input type="text" id="reasonInput" placeholder="Reason (e.g. groceries, petrol)">
    <div class="chip-row" id="reasonChips"></div>
    <input type="date" id="dateInput">
    <button class="submit-btn" id="addBtn">Add entry</button>
  </div>

  <div class="entries-label" id="entriesLabel">Entries this month</div>
  <div id="entriesList"></div>

  <div class="export-row">
    <button id="exportBtn">Export backup</button>
    <button id="importBtn">Import backup</button>
  </div>
  <input type="file" id="importFile" accept="application/json" style="display:none;">

  <div class="status" id="statusMsg"></div>
</div>

<script>
function showToast(msg, isError) {
  let wrap = document.getElementById('toastWrap');
  if (!wrap) {
    wrap = document.createElement('div');
    wrap.id = 'toastWrap';
    wrap.className = 'toast-wrap';
    document.body.appendChild(wrap);
  }
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' err' : '');
  t.textContent = msg;
  wrap.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 250);
  }, 1700);
}

let allEntries = [];
let accounts = [];
let accountFilter = 'all';
let currentType = 'credit';
let viewYear, viewMonth; // viewMonth 0-indexed

const STORAGE_KEY = 'cache_entries';
const ACCOUNTS_KEY = 'cache_accounts';
const SETTINGS_KEY = 'hub_settings';
const STREAK_KEY = 'hub_streak_days';
const ACCOUNT_PALETTE = ['#4fb2e2', '#e2a34f', '#9b7fe0', '#4fd6b0', '#e2574f', '#7fe04f', '#e04f9b', '#6f8fe0'];
const TRANSFER_COLOR = '#a78bfa';

let CURRENCY = '₹';
let CATEGORIES = ['Food', 'Fuel', 'Salary', 'Bills', 'Other expenses'];
let CATEGORY_COLORS = {
  'Food': '#e29e4f',
  'Fuel': '#4fb2e2',
  'Salary': '#4fd68c',
  'Bills': '#e2574f',
  'Other expenses': '#8a8a8a'
};

function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.currency) CURRENCY = s.currency;
    if (s.categories && s.categories.length) {
      CATEGORIES = s.categories.map(c => c.name);
      CATEGORY_COLORS = {};
      s.categories.forEach(c => { CATEGORY_COLORS[c.name] = c.color; });
    }
  } catch (e) { /* keep defaults */ }
}

function populateCategoryOptions() {
  const select = document.getElementById('categoryInput');
  select.innerHTML = CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');
}

function loadAccounts() {
  try {
    const raw = localStorage.getItem(ACCOUNTS_KEY);
    accounts = raw ? JSON.parse(raw) : [];
  } catch (e) { accounts = []; }
  if (!accounts.length) {
    accounts = [
      { id: 'acc1', name: 'Account 1', color: ACCOUNT_PALETTE[0] },
      { id: 'acc2', name: 'Account 2', color: ACCOUNT_PALETTE[1] },
      { id: 'acc3', name: 'Account 3', color: ACCOUNT_PALETTE[2] },
    ];
    saveAccounts();
  }
}

function saveAccounts() {
  localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts));
}

function getAccount(id) {
  return accounts.find(a => a.id === id) || { id, name: 'Unassigned', color: '#8a8a8a' };
}

function migrateEntries() {
  let changed = false;
  const fallback = accounts[0] ? accounts[0].id : null;
  allEntries.forEach(e => {
    if (!e.account && fallback) { e.account = fallback; changed = true; }
  });
  if (changed) saveEntries();
}

function populateAccountOptions() {
  ['accountInput', 'fromAccountInput', 'toAccountInput'].forEach(id => {
    const select = document.getElementById(id);
    if (!select) return;
    const prev = select.value;
    select.innerHTML = accounts.map(a => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('');
    if (prev && accounts.some(a => a.id === prev)) select.value = prev;
  });
  const fromSel = document.getElementById('fromAccountInput');
  const toSel = document.getElementById('toAccountInput');
  if (fromSel && toSel && accounts.length > 1 && fromSel.value === toSel.value) {
    toSel.value = accounts.find(a => a.id !== fromSel.value).id;
  }
}

function recordActivity() {
  try {
    const days = JSON.parse(localStorage.getItem(STREAK_KEY) || '[]');
    const today = todayStr();
    if (days[days.length - 1] !== today) {
      days.push(today);
      localStorage.setItem(STREAK_KEY, JSON.stringify(days));
    }
  } catch (e) { /* non-critical */ }
}

function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function fmtMoney(n) {
  const sign = n < 0 ? '−' : '';
  const rounded = Math.abs(Math.round(n * 100) / 100);
  return sign + CURRENCY + rounded.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

let balanceAnimFrame = null;
function animateBalance(el, target) {
  const startText = el.getAttribute('data-raw');
  const start = startText !== null ? parseFloat(startText) : target;
  el.setAttribute('data-raw', target);

  if (balanceAnimFrame) cancelAnimationFrame(balanceAnimFrame);
  const duration = 400;
  const startTime = performance.now();

  function step(now) {
    const progress = Math.min((now - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    const current = start + (target - start) * eased;
    el.textContent = fmtMoney(current);
    if (progress < 1) {
      balanceAnimFrame = requestAnimationFrame(step);
    }
  }
  balanceAnimFrame = requestAnimationFrame(step);
}

function monthKey(y, m) {
  return y + '-' + String(m+1).padStart(2,'0');
}

function loadEntries() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    allEntries = raw ? JSON.parse(raw) : [];
  } catch (e) {
    allEntries = [];
  }
}

function saveEntries() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allEntries));
    recordActivity();
    setStatus('Saved');
  } catch (e) {
    setStatus('Save failed — storage unavailable');
  }
}

function setStatus(msg) {
  if (msg === 'Saved') return; // silent success on every keystroke-save; only show meaningful events
  const isError = /fail|invalid|could not|enter a valid/i.test(msg);
  showToast(msg, isError);
}

function entriesForMonth(y, m, accountId = 'all') {
  const key = monthKey(y, m);
  return allEntries.filter(e =>
    e.date.slice(0,7) === key && (accountId === 'all' || e.account === accountId)
  );
}

function openingBalanceFor(y, m, accountId = 'all') {
  const cutoff = monthKey(y, m);
  let sum = 0;
  for (const e of allEntries) {
    if (accountId !== 'all' && e.account !== accountId) continue;
    if (e.date.slice(0,7) < cutoff) {
      sum += e.type === 'credit' ? e.amount : -e.amount;
    }
  }
  return sum;
}

function balanceThroughMonth(y, m, accountId = 'all') {
  const cutoff = monthKey(y, m);
  let sum = 0;
  for (const e of allEntries) {
    if (accountId !== 'all' && e.account !== accountId) continue;
    if (e.date.slice(0,7) <= cutoff) {
      sum += e.type === 'credit' ? e.amount : -e.amount;
    }
  }
  return sum;
}

function buildCategoryRows(entries, maxVal) {
  const totals = {};
  entries.forEach(e => {
    const cat = e.category || 'Other expenses';
    totals[cat] = (totals[cat] || 0) + e.amount;
  });
  return Object.entries(totals)
    .sort((a, b) => b[1] - a[1])
    .map(([cat, amt]) => {
      const color = cat === 'Transfer' ? TRANSFER_COLOR : (CATEGORY_COLORS[cat] || '#8a8a8a');
      return `
        <div class="chart-row">
          <div class="chart-dot" style="background:${color}"></div>
          <div class="chart-cat">${cat}</div>
          <div class="chart-track"><div class="chart-fill" style="width:${pct.toFixed(1)}%;background:${color}"></div></div>
          <div class="chart-amount">${fmtMoney(amt)}</div>
        </div>
      `;
    }).join('');
}

function renderChart(monthEntries) {
  const card = document.getElementById('chartCard');
  const credits = monthEntries.filter(e => e.type === 'credit');
  const debits = monthEntries.filter(e => e.type === 'debit');

  if (credits.length === 0 && debits.length === 0) {
    card.innerHTML = '<div class="chart-empty">Nothing logged yet this month — the chart fills in as you add entries.</div>';
    return;
  }

  // Shared scale so credit and debit bars are comparable, but kept in
  // clearly separate groups so credit never reads as an expense category.
  const creditTotal = credits.reduce((s, e) => s + e.amount, 0);
  const debitTotals = {};
  debits.forEach(e => {
    const cat = e.category || 'Other expenses';
    debitTotals[cat] = (debitTotals[cat] || 0) + e.amount;
  });
  const maxDebit = Object.values(debitTotals).length ? Math.max(...Object.values(debitTotals)) : 0;
  const maxVal = Math.max(creditTotal, maxDebit);

  let html = '';

  if (credits.length > 0) {
    const pct = maxVal > 0 ? (creditTotal / maxVal) * 100 : 0;
    html += `
      <div class="chart-subhead">Credits</div>
      <div class="chart-row credit-row">
        <div class="chart-dot" style="background:#4fd68c"></div>
        <div class="chart-cat">Total in</div>
        <div class="chart-track"><div class="chart-fill" style="width:${pct.toFixed(1)}%;background:#4fd68c"></div></div>
        <div class="chart-amount">${fmtMoney(creditTotal)}</div>
      </div>
    `;
  }

  if (debits.length > 0) {
    if (credits.length > 0) html += '<div class="chart-divider"></div>';
    html += '<div class="chart-subhead">Spending by category</div>';
    html += buildCategoryRows(debits, maxVal);
  }

  card.innerHTML = html;
}

function lastThreeMonths(y, m) {
  // returns 3 {year, month} objects, oldest first, ending at (y, m)
  const arr = [];
  for (let i = 2; i >= 0; i--) {
    let mm = m - i;
    let yy = y;
    while (mm < 0) { mm += 12; yy -= 1; }
    arr.push({ year: yy, month: mm });
  }
  return arr;
}

function debitTotalsForMonth(y, m, accountId = 'all') {
  const totals = {};
  entriesForMonth(y, m, accountId).forEach(e => {
    if (e.type !== 'debit') return;
    if (accountId === 'all' && e.category === 'Transfer') return;
    const cat = e.category || 'Other expenses';
    totals[cat] = (totals[cat] || 0) + e.amount;
  });
  return totals;
}

function renderTrend(y, m, accountId = 'all') {
  const card = document.getElementById('trendCard');
  const months = lastThreeMonths(y, m);
  const monthTotals = months.map(mo => debitTotalsForMonth(mo.year, mo.month, accountId));

  const catsWithData = new Set();
  monthTotals.forEach(mt => Object.keys(mt).forEach(c => catsWithData.add(c)));

  if (catsWithData.size === 0) {
    card.innerHTML = '<div class="chart-empty">Not enough history yet — the trend fills in once a couple of months of spending are logged.</div>';
    return;
  }

  // known categories first (stable order/colors), then any leftover ones
  const cats = CATEGORIES.filter(c => catsWithData.has(c))
    .concat([...catsWithData].filter(c => !CATEGORIES.includes(c)));

  let maxVal = 0;
  monthTotals.forEach(mt => Object.values(mt).forEach(v => { if (v > maxVal) maxVal = v; }));
  if (maxVal === 0) maxVal = 1;

  const monthNamesShort = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const xs = [55, 217, 379];
  const yTop = 12, yBottom = 92;
  const yFor = (val) => yBottom - (val / maxVal) * (yBottom - yTop);

  let svgLines = '', svgDots = '';
  cats.forEach(cat => {
    const color = CATEGORY_COLORS[cat] || '#8a8a8a';
    const pts = months.map((mo, i) => `${xs[i]},${yFor(monthTotals[i][cat] || 0).toFixed(1)}`);
    svgLines += `<polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.9" />`;
    pts.forEach((p, i) => {
      const [px, py] = p.split(',');
      const val = monthTotals[i][cat] || 0;
      const label = `${cat} \u2014 ${monthNamesShort[months[i].month]}: ${fmtMoney(val)}`;
      svgDots += `<circle cx="${px}" cy="${py}" r="7" fill="transparent" class="trend-dot-hit" data-label="${escapeHtml(label)}" style="cursor:pointer;" />`;
      svgDots += `<circle cx="${px}" cy="${py}" r="3" fill="${color}" style="pointer-events:none;" />`;
    });
  });

  const gridLine = `<line x1="30" y1="${yBottom}" x2="404" y2="${yBottom}" stroke="#1e1e1e" stroke-width="1" />`;
  const labels = months.map((mo, i) =>
    `<text x="${xs[i]}" y="110" text-anchor="middle" font-size="10" fill="#777">${monthNamesShort[mo.month]}</text>`
  ).join('');

  const legend = cats.map(cat => {
    const color = CATEGORY_COLORS[cat] || '#8a8a8a';
    return `<div class="trend-legend-item"><span class="trend-dot" style="background:${color}"></span>${cat}</div>`;
  }).join('');

  card.innerHTML = `
    <svg viewBox="0 0 420 120" style="width:100%;height:auto;display:block;overflow:visible;">
      ${gridLine}
      ${svgLines}
      ${svgDots}
      ${labels}
    </svg>
    <div class="trend-legend">${legend}</div>
  `;

  card.querySelectorAll('.trend-dot-hit').forEach(dot => {
    dot.addEventListener('click', () => {
      showToast(dot.getAttribute('data-label'));
    });
  });
}

function renderReasonChips() {
  const wrap = document.getElementById('reasonChips');
  const counts = {};
  allEntries.forEach(e => {
    if (e.type !== currentType) return;
    if (e.category === 'Transfer') return;
    const r = (e.reason || '').trim();
    if (!r) return;
    counts[r] = (counts[r] || 0) + 1;
  });
  const top = Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 6)
    .map(([reason]) => reason);

  if (top.length === 0) {
    wrap.innerHTML = '';
    return;
  }

  const reasonInput = document.getElementById('reasonInput');
  wrap.innerHTML = top.map(r =>
    `<button type="button" class="chip" data-reason="${escapeHtml(r)}">${escapeHtml(r)}</button>`
  ).join('');

  wrap.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      reasonInput.value = chip.getAttribute('data-reason');
      wrap.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      reasonInput.focus();
    });
  });
}

function renderAccountsRow() {
  const wrap = document.getElementById('accountsScroll');
  wrap.innerHTML = '';
  accounts.forEach(a => {
    const bal = balanceThroughMonth(viewYear, viewMonth, a.id);
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'account-chip-card' + (accountFilter === a.id ? ' active' : '');
    card.style.setProperty('--acc-color', a.color);
    card.innerHTML = `
      <div class="account-chip-name">${escapeHtml(a.name)}</div>
      <div class="account-chip-balance ${bal < 0 ? 'neg' : ''}">${fmtMoney(bal)}</div>
    `;
    card.addEventListener('click', () => {
      accountFilter = (accountFilter === a.id) ? 'all' : a.id;
      render();
    });
    wrap.appendChild(card);
  });
}

function renderAccountRows() {
  const wrap = document.getElementById('accountRows');
  wrap.innerHTML = '';
  accounts.forEach(a => {
    const row = document.createElement('div');
    row.className = 'account-row';
    row.innerHTML = `
      <span class="account-dot" style="background:${a.color}"></span>
      <input type="text" class="account-name-input" data-id="${a.id}" value="${escapeHtml(a.name)}">
      <button type="button" class="account-del-btn" data-id="${a.id}" title="Delete account">&#10005;</button>
    `;
    wrap.appendChild(row);
  });

  wrap.querySelectorAll('.account-name-input').forEach(inp => {
    inp.addEventListener('change', () => {
      const id = inp.getAttribute('data-id');
      const acc = accounts.find(a => a.id === id);
      const val = inp.value.trim();
      if (!acc || !val) { if (acc) inp.value = acc.name; return; }
      acc.name = val;
      saveAccounts();
      populateAccountOptions();
      render();
    });
  });

  wrap.querySelectorAll('.account-del-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-id');
      if (accounts.length <= 1) { showToast('Keep at least one account', true); return; }
      const acc = accounts.find(a => a.id === id);
      const count = allEntries.filter(e => e.account === id).length;
      const msg = count > 0
        ? `Delete "${acc.name}"? This also deletes ${count} ${count === 1 ? 'entry' : 'entries'} logged to it.`
        : `Delete "${acc.name}"?`;
      if (!confirm(msg)) return;

      accounts = accounts.filter(a => a.id !== id);
      allEntries = allEntries.filter(e => e.account !== id);
      saveAccounts();
      saveEntries();
      if (accountFilter === id) accountFilter = 'all';

      renderAccountRows();
      populateAccountOptions();
      render();
      renderReasonChips();
      showToast(`Deleted ${acc.name}`);
    });
  });
}

function render() {
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('monthTitle').textContent = monthNames[viewMonth] + ' ' + viewYear;

  const monthEntries = entriesForMonth(viewYear, viewMonth, accountFilter).sort((a,b) => a.date.localeCompare(b.date));
  const displayEntries = accountFilter === 'all' ? monthEntries.filter(e => e.category !== 'Transfer') : monthEntries;
  const opening = openingBalanceFor(viewYear, viewMonth, accountFilter);
  let credit = 0, debit = 0;
  for (const e of displayEntries) {
    if (e.type === 'credit') credit += e.amount; else debit += e.amount;
  }
  const closing = opening + credit - debit;

  document.getElementById('balanceLabel').textContent = accountFilter === 'all' ? 'Overall balance' : getAccount(accountFilter).name + ' balance';
  document.getElementById('overallCard').classList.toggle('active', accountFilter === 'all');
  document.getElementById('monthSub').textContent = monthEntries.length + (monthEntries.length === 1 ? ' entry' : ' entries') +
    (accountFilter !== 'all' ? ' \u00b7 ' + getAccount(accountFilter).name : '');
  document.getElementById('openingStat').textContent = fmtMoney(opening);
  document.getElementById('creditStat').textContent = fmtMoney(credit);
  document.getElementById('debitStat').textContent = fmtMoney(debit);

  const closingEl = document.getElementById('closingBalance');
  animateBalance(closingEl, closing);
  closingEl.className = 'balance-value ' + (closing < 0 ? 'neg' : 'pos');

  const now = new Date();
  const isCurrentOrFuture = (viewYear > now.getFullYear()) ||
    (viewYear === now.getFullYear() && viewMonth >= now.getMonth());
  document.getElementById('nextBtn').disabled = isCurrentOrFuture;

  renderAccountsRow();
  renderChart(displayEntries);
  renderTrend(viewYear, viewMonth, accountFilter);

  const entriesLabel = document.getElementById('entriesLabel');
  entriesLabel.textContent = 'Entries this month' + (accountFilter !== 'all' ? ' \u00b7 ' + getAccount(accountFilter).name : '');

  const list = document.getElementById('entriesList');
  list.innerHTML = '';
  if (monthEntries.length === 0) {
    list.innerHTML = '<div class="empty">A clean slate — add your first entry for this month above.</div>';
    return;
  }
  for (const e of [...monthEntries].reverse()) {
    const row = document.createElement('div');
    row.className = 'entry';
    const d = new Date(e.date + 'T00:00:00');
    const dateLabel = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    const cat = e.category || 'Other expenses';
    const catColor = cat === 'Transfer' ? TRANSFER_COLOR : (CATEGORY_COLORS[cat] || '#8a8a8a');
    const accId = e.account || (accounts[0] ? accounts[0].id : null);
    const acc = getAccount(accId);
    const isTransfer = !!e.transferId;
    const accountTag = isTransfer
      ? `<span style="color:${acc.color};font-size:10px;font-weight:700;letter-spacing:0.3px;">${escapeHtml(acc.name)}</span>`
      : `<select class="entry-account-select" data-id="${e.id}" style="color:${acc.color}">
          ${accounts.map(a => `<option value="${a.id}" ${a.id === accId ? 'selected' : ''}>${escapeHtml(a.name)}</option>`).join('')}
        </select>`;
    row.innerHTML = `
      <div class="entry-left">
        <div class="entry-reason">${escapeHtml(e.reason || cat)}</div>
        <div class="entry-meta">
          <span class="entry-cat-tag" style="background:${catColor}22;color:${catColor}">${cat}</span>
          ${accountTag}
          <span>${dateLabel}</span>
        </div>
      </div>
      <div class="entry-right">
        <div class="entry-amount ${e.type}">${e.type === 'credit' ? '+' : '−'}${fmtMoney(e.amount)}</div>
        <button class="del-btn" data-id="${e.id}">✕</button>
      </div>
    `;
    list.appendChild(row);
  }
  list.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-id');
      const entry = allEntries.find(e => e.id === id);
      if (entry && entry.transferId) {
        if (!confirm('Delete this transfer? This removes both sides of the transfer.')) return;
        allEntries = allEntries.filter(e => e.transferId !== entry.transferId);
      } else {
        allEntries = allEntries.filter(e => e.id !== id);
      }
      saveEntries();
      render();
      renderReasonChips();
    });
  });
  list.querySelectorAll('.entry-account-select').forEach(sel => {
    sel.addEventListener('change', () => {
      const id = sel.getAttribute('data-id');
      const entry = allEntries.find(e => e.id === id);
      if (entry) {
        entry.account = sel.value;
        saveEntries();
        render();
      }
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('creditBtn').addEventListener('click', () => {
  currentType = 'credit';
  document.getElementById('creditBtn').classList.add('active-credit');
  document.getElementById('debitBtn').classList.remove('active-debit');
  document.getElementById('transferBtn').classList.remove('active-transfer');
  document.getElementById('normalFields').style.display = 'flex';
  document.getElementById('transferFields').style.display = 'none';
  document.getElementById('reasonInput').placeholder = 'Reason (e.g. groceries, petrol)';
  document.getElementById('reasonChips').style.display = 'flex';
  document.getElementById('addBtn').textContent = 'Add entry';

});
document.getElementById('debitBtn').addEventListener('click', () => {
  currentType = 'debit';
  document.getElementById('debitBtn').classList.add('active-debit');
  document.getElementById('creditBtn').classList.remove('active-credit');
  document.getElementById('transferBtn').classList.remove('active-transfer');
  document.getElementById('normalFields').style.display = 'flex';
  document.getElementById('transferFields').style.display = 'none';
  document.getElementById('reasonInput').placeholder = 'Reason (e.g. groceries, petrol)';
  document.getElementById('reasonChips').style.display = 'flex';
  document.getElementById('addBtn').textContent = 'Add entry';
  renderReasonChips();
});
document.getElementById('transferBtn').addEventListener('click', () => {
  currentType = 'transfer';
  document.getElementById('transferBtn').classList.add('active-transfer');
  document.getElementById('creditBtn').classList.remove('active-credit');
  document.getElementById('debitBtn').classList.remove('active-debit');
  document.getElementById('normalFields').style.display = 'none';
  document.getElementById('transferFields').style.display = 'flex';
  document.getElementById('reasonInput').placeholder = 'Note (optional)';
  document.getElementById('reasonChips').style.display = 'none';

});

document.getElementById('addBtn').addEventListener('click', () => {
  if (currentType === 'transfer') { handleTransferSubmit(); return; }

  const amountInput = document.getElementById('amountInput');
  const reasonInput = document.getElementById('reasonInput');
  const dateInput = document.getElementById('dateInput');
  const categoryInput = document.getElementById('categoryInput');
  const accountInput = document.getElementById('accountInput');

  const amount = Math.round(parseFloat(amountInput.value) * 100) / 100;
  if (!amount || amount <= 0) { setStatus('Enter a valid amount'); return; }
  const date = dateInput.value || todayStr();
  const reason = reasonInput.value.trim();
  const category = categoryInput.value;
  const account = accountInput.value;
  if (!account) { setStatus('Select an account'); return; }

  const entry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    amount, reason, type: currentType, date, category, account
  };
  allEntries.push(entry);
  saveEntries();

  amountInput.value = '';
  reasonInput.value = '';

  const [y, m] = date.split('-').map(Number);
  viewYear = y; viewMonth = m - 1;

  render();
  renderReasonChips();
  showToast((currentType === 'credit' ? '+' : '−') + fmtMoney(amount).replace(/^[+−]?/, '') + ' logged \u00b7 ' + getAccount(account).name);
});

function handleTransferSubmit() {
  const amountInput = document.getElementById('amountInput');
  const dateInput = document.getElementById('dateInput');
  const reasonInput = document.getElementById('reasonInput');
  const fromSel = document.getElementById('fromAccountInput');
  const toSel = document.getElementById('toAccountInput');

  const amount = Math.round(parseFloat(amountInput.value) * 100) / 100;
  if (!amount || amount <= 0) { setStatus('Enter a valid amount'); return; }
  const fromId = fromSel.value, toId = toSel.value;
  if (!fromId || !toId) { setStatus('Select both accounts'); return; }
  if (fromId === toId) { setStatus('Choose two different accounts'); return; }

  const date = dateInput.value || todayStr();
  const note = reasonInput.value.trim();
  const fromName = getAccount(fromId).name;
  const toName = getAccount(toId).name;
  const transferId = 't_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

  const outEntry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    amount, type: 'debit', date, category: 'Transfer',
    reason: note || `Transfer to ${toName}`,
    account: fromId, transferId
  };
  const inEntry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6) + 'i',
    amount, type: 'credit', date, category: 'Transfer',
    reason: note || `Transfer from ${fromName}`,
    account: toId, transferId
  };
  allEntries.push(outEntry, inEntry);
  saveEntries();

  amountInput.value = '';
  reasonInput.value = '';

  const [y, m] = date.split('-').map(Number);
  viewYear = y; viewMonth = m - 1;

  render();
  showToast(fmtMoney(amount) + ' moved: ' + fromName + ' \u2192 ' + toName);
}

document.getElementById('prevBtn').addEventListener('click', () => {
  viewMonth--;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  render();
});
document.getElementById('nextBtn').addEventListener('click', () => {
  viewMonth++;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  render();
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(allEntries, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'cache-backup-' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      if (Array.isArray(imported)) {
        allEntries = imported;
        saveEntries();
        render();
        renderReasonChips();
        setStatus('Backup imported');
      } else {
        setStatus('Invalid backup file');
      }
    } catch (e) {
      setStatus('Could not read file');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
});

document.getElementById('overallCard').addEventListener('click', () => {
  accountFilter = 'all';
  render();
});

document.getElementById('manageToggle').addEventListener('click', () => {
  const panel = document.getElementById('managePanel');
  const isHidden = panel.style.display === 'none';
  panel.style.display = isHidden ? 'block' : 'none';
  document.getElementById('manageToggle').textContent = isHidden ? 'Done' : 'Manage';
  if (isHidden) renderAccountRows();
});

document.getElementById('addAccountBtn').addEventListener('click', () => {
  const input = document.getElementById('newAccountName');
  const name = input.value.trim();
  if (!name) { showToast('Enter an account name', true); return; }
  const id = 'acc_' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
  const color = ACCOUNT_PALETTE[accounts.length % ACCOUNT_PALETTE.length];
  accounts.push({ id, name, color });
  saveAccounts();
  input.value = '';
  renderAccountRows();
  populateAccountOptions();
  render();
  showToast(`Added ${name}`);
});

(function init() {
  const now = new Date();
  viewYear = now.getFullYear();
  viewMonth = now.getMonth();
  document.getElementById('dateInput').value = todayStr();
  loadSettings();
  populateCategoryOptions();
  loadAccounts();
  loadEntries();
  migrateEntries();
  populateAccountOptions();
  render();
  renderReasonChips();
})();
</script>
</body>
</html>
