
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Backlog">
<title>Backlog</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:        #080808;
    --surface:   #101010;
    --border:    #1c1c1c;
    --text:      #e0e0e0;
    --muted:     #555;
    --accent:    #a78bfa;
    --buy:       #e2a34f;
    --ready:     #4fb2e2;
    --finished:  #4fd68c;
    --gold:      #ffd54a;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 56px;
    max-width: 520px;
    margin: 0 auto;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #555;
    text-decoration: none;
    margin-bottom: 14px;
  }
  .back-link:hover { color: #f2f2f2; }

  .brand {
    text-align: center;
    margin-bottom: 22px;
  }
  .brand-name {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .brand-tag {
    font-size: 11px;
    color: #666;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  /* ── OVERVIEW ── */
  .overview {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 22px;
  }
  .overview-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .overview-count {
    font-size: 26px;
    font-weight: 800;
    color: #fff;
  }
  .overview-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .overview-stats {
    display: flex;
    gap: 16px;
    font-size: 11px;
    color: #888;
  }
  .overview-stats b { color: #ccc; font-weight: 700; }
  .overview-bar-bg {
    height: 5px;
    background: #1a1a1a;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 12px;
  }
  .overview-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--finished), var(--gold));
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .current-phase-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #1a1a1a;
  }
  .cp-left { display: flex; flex-direction: column; gap: 2px; }
  .cp-label {
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .cp-name { font-size: 13px; font-weight: 700; color: #fff; }
  .cp-game { font-size: 11.5px; color: var(--accent); margin-top: 1px; }
  .cp-count {
    font-family: monospace;
    font-size: 12px;
    color: #888;
  }
  .cp-none { font-size: 12px; color: #555; font-style: italic; }

  /* ── ADD GAME ── */
  .add-game-toggle {
    display: block;
    width: 100%;
    background: var(--surface);
    border: 1px dashed #2e2e2e;
    border-radius: 10px;
    color: var(--accent);
    font-family: 'Exo 2', sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 11px;
    cursor: pointer;
    margin-bottom: 14px;
    transition: border-color 0.15s, background 0.15s;
  }
  .add-game-toggle:hover { border-color: var(--accent); background: rgba(167,139,250,0.05); }

  .add-game-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 18px;
  }
  .add-game-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .add-game-panel select,
  .add-game-panel input[type="text"],
  .add-game-panel input[type="number"] {
    background: #0a0a0a;
    border: 1px solid #252525;
    border-radius: 6px;
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    font-size: 12.5px;
    padding: 8px 10px;
    outline: none;
  }
  .add-game-panel select { flex: 2; min-width: 0; }
  .add-game-panel input[type="number"] { flex: 1; min-width: 0; }
  .add-game-panel input[type="text"] { width: 100%; margin-bottom: 8px; }
  .add-game-panel select:focus,
  .add-game-panel input:focus { border-color: #5b21b6; }
  .add-game-panel input::placeholder { color: #3a3a3a; }

  .add-game-checks {
    display: flex;
    gap: 16px;
    margin-bottom: 10px;
    font-size: 12px;
    color: #999;
  }
  .add-game-checks label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .add-game-checks input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; }

  .add-game-submit {
    width: 100%;
    background: rgba(167,139,250,0.12);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Exo 2', sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 10px;
    border-radius: 7px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .add-game-submit:hover { opacity: 0.8; }
  .add-game-submit:active { opacity: 0.5; }

  /* ── COMPLETED PHASES SUMMARY ── */
  .completed-summary {
    margin-bottom: 18px;
  }
  .completed-summary .section-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .completed-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 2px solid var(--finished);
    border-radius: 7px;
    margin-bottom: 6px;
    font-size: 12.5px;
  }
  .completed-row.perfected {
    border-left-color: var(--gold);
    background: rgba(255,213,74,0.045);
  }
  .completed-row-name { color: #ddd; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .completed-row.perfected .completed-row-name { color: var(--gold); }
  .completed-row-count { font-family: monospace; color: #777; }
  .completed-row.perfected .completed-row-count { color: var(--gold); }

  /* ── PHASE CARD ── */
  .phase-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .phase-card.current { border-color: #3a3060; }
  .phase-card.completed { border-color: #295a3f; background: rgba(79,214,140,0.035); }
  .phase-card.perfected {
    border-color: var(--gold);
    background: rgba(255,213,74,0.05);
    box-shadow: 0 0 18px rgba(255,213,74,0.08);
  }
  .phase-badge {
    font-size: 8.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .phase-badge.badge-current {
    color: var(--accent);
    background: rgba(167,139,250,0.14);
    border: 1px solid rgba(167,139,250,0.3);
  }
  .phase-badge.badge-completed {
    color: var(--finished);
    background: rgba(79,214,140,0.14);
    border: 1px solid rgba(79,214,140,0.3);
  }
  .phase-badge.badge-perfected {
    color: var(--gold);
    background: rgba(255,213,74,0.16);
    border: 1px solid rgba(255,213,74,0.4);
  }
  .phase-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 14px;
    cursor: pointer;
    gap: 10px;
  }
  .phase-head-left {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }
  .phase-num {
    font-size: 9.5px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .phase-name {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .phase-head-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .phase-progress {
    font-family: monospace;
    font-size: 11px;
    color: #777;
    white-space: nowrap;
  }
  .phase-chevron {
    color: #444;
    font-size: 13px;
    transition: transform 0.2s ease;
  }
  .phase-card.open .phase-chevron { transform: rotate(90deg); }

  .phase-body {
    display: none;
    padding: 0 14px 14px;
  }
  .phase-card.open .phase-body { display: block; }

  /* ── GAME ROW ── */
  .game-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 0;
    border-top: 1px solid #191919;
  }
  .game-row:first-child { border-top: none; }
  .game-row.complete100 {
    background: rgba(255,213,74,0.045);
    margin: 0 -14px;
    padding: 9px 14px;
    border-top: 1px solid rgba(255,213,74,0.12);
    border-left: 2px solid var(--gold);
  }
  .game-left { min-width: 0; flex: 1; }
  .game-name {
    font-size: 13px;
    font-weight: 600;
    color: #ddd;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .game-row.complete100 .game-name { color: var(--gold); }
  .game-tags {
    display: flex;
    gap: 6px;
    margin-top: 2px;
  }
  .game-tag {
    font-size: 9px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #555;
  }
  .game-tag.epic { color: #8a7fe0; }
  .game-tag.gold-tag { color: var(--gold); font-weight: 700; }
  .game-tag.custom-tag { color: var(--accent); }

  .remove-btn {
    background: none;
    border: none;
    color: #3a3a3a;
    font-size: 11px;
    cursor: pointer;
    padding: 4px;
  }
  .remove-btn:hover { color: var(--buy); }

  .game-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .status-pill {
    font-family: 'Exo 2', sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.4px;
    padding: 6px 11px;
    border-radius: 6px;
    border: 1px solid;
    background: transparent;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s;
  }
  .status-pill:hover { opacity: 0.75; }
  .status-pill:active { opacity: 0.45; }
  .status-buy      { color: var(--buy);      border-color: #e2a34f55; }
  .status-ready    { color: var(--ready);    border-color: #4fb2e255; }
  .status-finished { color: var(--finished); border-color: #4fd68c55; background: rgba(79,214,140,0.08); }

  .reset-btn {
    background: none;
    border: none;
    color: #333;
    font-size: 13px;
    cursor: pointer;
    padding: 4px;
  }
  .reset-btn:hover { color: #777; }

  .star-btn {
    background: none;
    border: 1px solid #262626;
    border-radius: 6px;
    color: #3a3a3a;
    font-size: 12px;
    cursor: pointer;
    padding: 5px 7px;
    transition: color 0.15s, border-color 0.15s;
  }
  .star-btn:hover { color: #888; border-color: #444; }
  .star-btn.active {
    color: var(--gold);
    border-color: #ffd54a66;
    background: rgba(255,213,74,0.08);
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #161616;
    border: 1px solid #2a2a2a;
    color: #eee;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
    opacity: 0;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    white-space: nowrap;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.gold {
    background: #1f1708;
    border-color: #ffd54a;
    color: #ffe08a;
    font-weight: 700;
    box-shadow: 0 0 22px rgba(255,213,74,0.3);
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  body { animation: fadeInUp 0.35s ease; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
</style>
</head>

// ─── STORAGE ─────────────────────────────────────────────────────────────────

const PROGRESS_KEY = 'backlog_progress';
const OPEN_KEY = 'backlog_open_phases';
const CUSTOM_KEY = 'backlog_custom_games';

function slug(name) {
  return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}
function gameKey(phaseNum, game) {
  if (game.custom) return 'p' + phaseNum + '_custom_' + game.id;
  return 'p' + phaseNum + '_' + slug(game.name);
}

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}'); } catch { return {}; }
}
function saveProgress(p) { localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); }

function loadOpenPhases() {
  try { return JSON.parse(localStorage.getItem(OPEN_KEY) || '{}'); } catch { return {}; }
}
function saveOpenPhases(o) { localStorage.setItem(OPEN_KEY, JSON.stringify(o)); }

function loadCustomGames() {
  try { return JSON.parse(localStorage.getItem(CUSTOM_KEY) || '{}'); } catch { return {}; }
}
function saveCustomGames(c) { localStorage.setItem(CUSTOM_KEY, JSON.stringify(c)); }

// Rebuilds a phase's game list by replaying custom insertions, in the order they were
// added, on top of the static list — so "slot 2" always means "becomes the 2nd item,
// everything from there on shifts down by one", reconstructed the same way every load.
function effectiveGames(phase) {
  const custom = loadCustomGames();
  const inserts = (custom[phase.num] || []).slice().sort((a, b) => a.addedAt - b.addedAt);
  let list = phase.games.map(g => ({ name: g.name, owned: g.owned, epic: !!g.epic, custom: false }));
  inserts.forEach(ins => {
    const pos = Math.max(0, Math.min(ins.position, list.length));
    list.splice(pos, 0, { name: ins.name, owned: ins.owned, epic: !!ins.epic, custom: true, id: ins.id });
  });
  return list;
}

function getState(phaseNum, game, progress) {
  const key = gameKey(phaseNum, game);
  const saved = progress[key];
  if (saved) return saved;
  return { status: game.owned ? 'ready' : 'buy', complete100: false };
}

// ─── STATUS LOGIC ────────────────────────────────────────────────────────────

function statusLabel(status, epic) {
  if (status === 'buy') return 'Buy';
  if (status === 'ready') return epic ? 'Download' : 'Play';
  if (status === 'downloaded') return 'Play';
  if (status === 'finished') return '\u2713 Finished';
  return status;
}
function statusClass(status) {
  if (status === 'buy') return 'status-buy';
  if (status === 'ready' || status === 'downloaded') return 'status-ready';
  return 'status-finished';
}
function nextStatus(status, epic) {
  if (status === 'buy') return 'ready';
  if (status === 'ready') return epic ? 'downloaded' : 'finished';
  if (status === 'downloaded') return 'finished';
  return 'finished';
}

// ─── RENDER ──────────────────────────────────────────────────────────────────

function renderOverview(progress) {
  let total = 0, finished = 0, owned = 0, buy = 0, gold = 0;
  PHASES.forEach(phase => {
    effectiveGames(phase).forEach(game => {
      total++;
      const st = getState(phase.num, game, progress);
      if (st.status === 'finished') finished++;
      if (st.status === 'buy') buy++;
      if (st.complete100) gold++;
      if (game.owned || st.status !== 'buy') owned++;
    });
  });
  document.getElementById('ovFinished').textContent = finished;
  document.getElementById('ovFinishedLabel').textContent = 'finished of ' + total;
  document.getElementById('ovOwned').textContent = owned;
  document.getElementById('ovBuy').textContent = buy;
  document.getElementById('ovGold').textContent = gold;
  document.getElementById('ovBar').style.width = (total ? (finished / total) * 100 : 0) + '%';

  const cpLine = document.getElementById('currentPhaseLine');
  const currentNum = findCurrentPhase(progress);
  if (currentNum) {
    const phase = PHASES.find(p => p.num === currentNum);
    const st = phaseStatus(phase, progress);
    const nextGame = findNextGame(phase, progress);
    cpLine.innerHTML = `
      <div class="cp-left">
        <div class="cp-label">You're at</div>
        <div class="cp-name">Phase ${String(phase.num).padStart(2,'0')} \u2014 ${phase.name}</div>
        ${nextGame ? `<div class="cp-game">Up next: ${nextGame.name}</div>` : ''}
      </div>
      <div class="cp-count">${st.finishedCount}/${st.total}</div>
    `;
  } else {
    cpLine.innerHTML = `<div class="cp-none">&#9733; All 17 phases finished &mdash; the whole saga is done.</div>`;
  }
}

function renderCompletedSummary(progress) {
  const wrap = document.getElementById('completedSummary');
  const list = document.getElementById('completedList');
  const completedPhases = PHASES
    .map(phase => ({ phase, st: phaseStatus(phase, progress) }))
    .filter(x => x.st.tier !== 'progress');

  if (!completedPhases.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';

  list.innerHTML = completedPhases.map(({ phase, st }) => `
    <div class="completed-row${st.tier === 'perfected' ? ' perfected' : ''}">
      <div class="completed-row-name">
        ${st.tier === 'perfected' ? '&#9733;' : '&#10003;'}
        Phase ${String(phase.num).padStart(2,'0')} \u2014 ${phase.name}
      </div>
      <div class="completed-row-count">${st.finishedCount}/${st.total}${st.tier === 'perfected' ? ' \u00b7 100%' : ''}</div>
    </div>
  `).join('');
}

// 'progress' = still has unfinished games, 'completed' = all finished, 'perfected' = all finished AND all 100%
function phaseStatus(phase, progress) {
  const games = effectiveGames(phase);
  const total = games.length;
  let finishedCount = 0, goldCount = 0;
  games.forEach(g => {
    const st = getState(phase.num, g, progress);
    if (st.status === 'finished') finishedCount++;
    if (st.complete100) goldCount++;
  });
  if (total > 0 && goldCount === total) return { tier: 'perfected', finishedCount, total };
  if (total > 0 && finishedCount === total) return { tier: 'completed', finishedCount, total };
  return { tier: 'progress', finishedCount, total };
}

function findCurrentPhase(progress) {
  for (const phase of PHASES) {
    if (phaseStatus(phase, progress).tier === 'progress') return phase.num;
  }
  return null;
}

function findNextGame(phase, progress) {
  return effectiveGames(phase).find(g => getState(phase.num, g, progress).status !== 'finished') || null;
}

function renderPhases() {
  const progress = loadProgress();
  const openState = loadOpenPhases();
  const currentPhaseNum = findCurrentPhase(progress);
  renderOverview(progress);
  renderCompletedSummary(progress);

  const container = document.getElementById('phasesContainer');
  container.innerHTML = '';

  const regular = [], perfectedPhases = [];
  PHASES.forEach(phase => {
    (phaseStatus(phase, progress).tier === 'perfected' ? perfectedPhases : regular).push(phase);
  });
  const orderedPhases = regular.concat(perfectedPhases);

  orderedPhases.forEach(phase => {
    const st = phaseStatus(phase, progress);
    const finishedCount = st.finishedCount;
    const isOpen = !!openState[phase.num];
    const isCurrent = phase.num === currentPhaseNum;

    let badge = '';
    if (st.tier === 'perfected') badge = '<span class="phase-badge badge-perfected">&#9733; Perfected</span>';
    else if (st.tier === 'completed') badge = '<span class="phase-badge badge-completed">&#10003; Completed</span>';
    else if (isCurrent) badge = '<span class="phase-badge badge-current">Current</span>';

    const card = document.createElement('div');
    card.className = 'phase-card'
      + (isOpen ? ' open' : '')
      + (isCurrent ? ' current' : '')
      + (st.tier === 'completed' ? ' completed' : '')
      + (st.tier === 'perfected' ? ' perfected' : '');

    const head = document.createElement('div');
    head.className = 'phase-head';
    head.innerHTML = `
      <div class="phase-head-left">
        <div class="phase-num">Phase ${String(phase.num).padStart(2,'0')}</div>
        <div class="phase-name">${phase.name}${badge}</div>
      </div>
      <div class="phase-head-right">
        <div class="phase-progress">${finishedCount}/${st.total}</div>
        <div class="phase-chevron">&#8250;</div>
      </div>
    `;
    head.addEventListener('click', () => {
      openState[phase.num] = !openState[phase.num];
      saveOpenPhases(openState);
      renderPhases();
    });
    card.appendChild(head);

    const body = document.createElement('div');
    body.className = 'phase-body';

    effectiveGames(phase).forEach(game => {
      const gst = getState(phase.num, game, progress);
      const key = gameKey(phase.num, game);
      const row = document.createElement('div');
      row.className = 'game-row' + (gst.complete100 ? ' complete100' : '');
      row.innerHTML = `
        <div class="game-left">
          <div class="game-name">${game.name}</div>
          <div class="game-tags">
            ${game.epic ? '<span class="game-tag epic">Epic</span>' : ''}
            ${game.custom ? '<span class="game-tag custom-tag">Added</span>' : ''}
            ${gst.complete100 ? '<span class="game-tag gold-tag">&#9733; 100%</span>' : ''}
          </div>
        </div>
        <div class="game-right">
          ${game.custom ? `<button class="remove-btn" data-remove-phase="${phase.num}" data-remove-id="${game.id}" title="Remove">&#10005;</button>` : ''}
          ${gst.status !== 'buy' || !game.owned ? `<button class="reset-btn" data-key="${key}" title="Reset">&#8634;</button>` : ''}
          <button class="status-pill ${statusClass(gst.status)}" data-key="${key}" data-status="${gst.status}" data-epic="${!!game.epic}">${statusLabel(gst.status, game.epic)}</button>
          ${gst.status === 'finished' ? `<button class="star-btn${gst.complete100 ? ' active' : ''}" data-key="${key}" title="100% complete">&#9733;</button>` : ''}
        </div>
      `;
      body.appendChild(row);
    });

    card.appendChild(body);
    container.appendChild(card);
  });

  container.querySelectorAll('.status-pill').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const key = btn.getAttribute('data-key');
      const status = btn.getAttribute('data-status');
      const epic = btn.getAttribute('data-epic') === 'true';
      const progress = loadProgress();
      const current = progress[key] || { status, complete100: false };
      current.status = nextStatus(current.status, epic);
      progress[key] = current;
      saveProgress(progress);
      const msg = current.status === 'ready' ? 'Marked ready'
        : current.status === 'downloaded' ? 'Downloaded — ready to play'
        : current.status === 'finished' ? '\u2713 Finished — nice one'
        : 'Updated';
      showToast(msg, current.status === 'finished');
      renderPhases();
    });
  });

  container.querySelectorAll('.star-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const key = btn.getAttribute('data-key');
      const progress = loadProgress();
      const current = progress[key] || { status: 'finished', complete100: false };
      current.complete100 = !current.complete100;
      progress[key] = current;
      saveProgress(progress);
      showToast(current.complete100 ? '\u2605 100% complete!' : '100% mark removed', current.complete100);
      renderPhases();
    });
  });

  container.querySelectorAll('.reset-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const key = btn.getAttribute('data-key');
      const progress = loadProgress();
      delete progress[key];
      saveProgress(progress);
      showToast('Reset');
      renderPhases();
    });
  });

  container.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const phaseNum = btn.getAttribute('data-remove-phase');
      const id = btn.getAttribute('data-remove-id');
      if (!confirm('Remove this game from the backlog?')) return;

      const custom = loadCustomGames();
      const list = custom[phaseNum] || [];
      const entry = list.find(g => g.id === id);
      custom[phaseNum] = list.filter(g => g.id !== id);
      saveCustomGames(custom);

      if (entry) {
        const progress = loadProgress();
        delete progress[gameKey(phaseNum, { custom: true, id })];
        saveProgress(progress);
      }
      showToast('Removed');
      renderPhases();
    });
  });
}

// ─── TOAST ───────────────────────────────────────────────────────────────────

let _toastTimer;
function showToast(msg, gold = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('show', 'gold');
  void el.offsetWidth;
  el.classList.add('show');
  if (gold) el.classList.add('gold');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show', 'gold'), 2200);
}

// ─── ADD GAME ────────────────────────────────────────────────────────────────

function populateAddPhaseSelect() {
  const select = document.getElementById('addPhaseSelect');
  select.innerHTML = PHASES.map(p =>
    `<option value="${p.num}">Phase ${String(p.num).padStart(2,'0')} \u2014 ${p.name}</option>`
  ).join('');
}

function updateSlotDefault() {
  const phaseNum = parseInt(document.getElementById('addPhaseSelect').value, 10);
  const phase = PHASES.find(p => p.num === phaseNum);
  const len = effectiveGames(phase).length;
  document.getElementById('addSlotInput').placeholder = 'Slot # (1\u2013' + (len + 1) + ')';
  document.getElementById('addSlotInput').value = '';
}

document.getElementById('addPhaseSelect').addEventListener('change', updateSlotDefault);

document.getElementById('addGameToggle').addEventListener('click', () => {
  const panel = document.getElementById('addGamePanel');
  const isHidden = panel.style.display === 'none';
  panel.style.display = isHidden ? 'block' : 'none';
  document.getElementById('addGameToggle').textContent = isHidden ? 'Cancel' : '+ Add Game';
  if (isHidden) {
    const progress = loadProgress();
    const cur = findCurrentPhase(progress);
    if (cur) document.getElementById('addPhaseSelect').value = cur;
    updateSlotDefault();
    document.getElementById('addNameInput').focus();
  }
});

document.getElementById('addGameSubmit').addEventListener('click', () => {
  const phaseNum = parseInt(document.getElementById('addPhaseSelect').value, 10);
  const phase = PHASES.find(p => p.num === phaseNum);
  const name = document.getElementById('addNameInput').value.trim();
  if (!name) { showToast('Enter a game name'); return; }
  const owned = document.getElementById('addOwnedCheck').checked;
  const epic = document.getElementById('addEpicCheck').checked;

  const len = effectiveGames(phase).length;
  let slot = parseInt(document.getElementById('addSlotInput').value, 10);
  if (isNaN(slot) || slot < 1) slot = len + 1;
  slot = Math.min(slot, len + 1);

  const custom = loadCustomGames();
  if (!custom[phaseNum]) custom[phaseNum] = [];
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  custom[phaseNum].push({ id, position: slot - 1, name, owned, epic, addedAt: Date.now() });
  saveCustomGames(custom);

  const openState = loadOpenPhases();
  openState[phaseNum] = true;
  saveOpenPhases(openState);

  document.getElementById('addNameInput').value = '';
  document.getElementById('addSlotInput').value = '';
  document.getElementById('addGamePanel').style.display = 'none';
  document.getElementById('addGameToggle').textContent = '+ Add Game';

  showToast(`Added ${name} \u2014 Phase ${String(phaseNum).padStart(2,'0')}, slot ${slot}`);
  renderPhases();
});

// ─── INIT ─────────────────────────────────────────────────────────────────────

(function init() {
  populateAddPhaseSelect();
  const openState = loadOpenPhases();
  if (Object.keys(openState).length === 0) {
    const progress = loadProgress();
    const cur = findCurrentPhase(progress);
    if (cur) { openState[cur] = true; saveOpenPhases(openState); }
  }
  renderPhases();
})();
</script>
</body>
