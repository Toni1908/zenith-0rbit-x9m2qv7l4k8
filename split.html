
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:      #080808;
    --surface: #101010;
    --border:  #1c1c1c;
    --text:    #e0e0e0;
    --muted:   #444;
    --accent:  #f87171;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px 60px;
  }
  .wrap { width: 100%; max-width: 460px; }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #555;
    text-decoration: none;
    margin-bottom: 18px;
  }
  .back-link:hover { color: var(--text); }

  .header {
    text-align: center;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .header-eyebrow {
    font-size: 10px;
    letter-spacing: 5px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .header-name {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: #fff;
  }

  .section-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .today-card {
    background: linear-gradient(180deg, #141414, #0f0f0f);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 26px;
  }
  .today-day { font-size: 12px; color: #888; letter-spacing: 0.5px; }
  .today-workout { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .today-btn {
    width: 100%;
    margin-top: 14px;
    padding: 11px 0;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #161616;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
  }
  .today-btn.done {
    background: rgba(74,222,128,0.12);
    border-color: #4ade80;
    color: #4ade80;
  }
  .today-btn:hover { border-color: #333; }
  .today-btn.done:hover { border-color: #4ade80; }

  .plan-list { margin-bottom: 24px; }
  .plan-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .plan-row.is-today { border-color: #333; }
  .plan-day {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #777;
    width: 38px;
    flex-shrink: 0;
  }
  .plan-row.is-today .plan-day { color: var(--accent); }
  .plan-input {
    flex: 1;
    background: #0d0d0d;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 7px 10px;
  }
  .plan-input:focus { outline: none; border-color: #444; }
  .plan-input::placeholder { color: #555; }

  .history-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 28px; }
  .history-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px;
  }
  .history-left { display: flex; flex-direction: column; }
  .history-date { font-size: 13px; font-weight: 500; }
  .history-workout { font-size: 11px; color: #777; margin-top: 1px; }
  .history-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #262626;
    flex-shrink: 0;
  }
  .history-dot.done { background: #4ade80; }

  .empty { text-align: center; color: #555; font-size: 12px; padding: 20px 0; }

  .save-note { font-size: 11px; color: #444; text-align: center; margin-top: 20px; }

  /* ===== Year heatmap ===== */
  .year-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .year-nav button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 32px; height: 32px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
  }
  .year-nav button:hover { border-color: #333; }
  .year-nav button:disabled { opacity: 0.3; cursor: default; }
  .year-title { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }

  .year-summary {
    text-align: center;
    font-size: 12px;
    color: #888;
    margin-bottom: 18px;
  }
  .year-summary strong { color: #4ade80; font-weight: 700; }

  .streak-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .streak-box {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 8px;
    text-align: center;
  }
  .streak-label {
    font-size: 9px;
    color: #777;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .streak-value {
    font-size: 19px;
    font-weight: 800;
    color: #4ade80;
    margin-top: 3px;
  }

  .month-block { margin-bottom: 0; }
  .month-block-label {
    font-size: 9px;
    color: #777;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .day-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .day-cell {
    aspect-ratio: 1;
    border-radius: 2px;
    background: var(--border);
  }
  .day-cell.done { cursor: pointer; }
  .day-cell.missed { cursor: pointer; }
  .day-cell.missed:hover { background: #262626; }
  .day-cell.done:hover { filter: brightness(1.2); }
  .day-cell.future { background: transparent; border: 1px dashed #1c1c1c; }
  .day-cell.is-today { box-shadow: 0 0 0 1.5px #fff inset; }

  #yearGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 16px 10px;
  }

  .year-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    margin: 16px 0 20px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .year-legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #aaa;
  }
  .year-legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  /* ===== shared polish ===== */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  body { animation: fadeInUp 0.35s ease; }
  body {
    padding-top: calc(env(safe-area-inset-top, 0px));
    padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px));
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #333; }
  * { scrollbar-width: thin; scrollbar-color: #262626 transparent; }

  button, a.card, .card {
    transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease, color 0.15s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.96); }
  a.card:active, .card:active { transform: scale(0.98); }

  .toast-wrap {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    pointer-events: none;
  }
  .toast {
    background: #161616;
    border: 1px solid #2a2a2a;
    color: #eee;
    font-size: 12px;
    font-weight: 500;
    padding: 9px 16px;
    border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.err { border-color: #e2574f; color: #f2a09c; }

</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">&#8592; Hub</a>

  <div class="header">
    <div class="header-eyebrow">Systems</div>
    <div class="header-name">Split</div>
  </div>

  <div class="today-card">
    <div class="today-day" id="todayDay">—</div>
    <div class="today-workout" id="todayWorkout">—</div>
    <button class="today-btn" id="todayBtn">Mark today done</button>
  </div>

  <div class="section-label">Weekly plan — tap to edit</div>
  <div class="plan-list" id="planList"></div>

  <div class="section-label">Last 14 days</div>
  <div class="history-list" id="historyList"></div>

  <div class="section-label">Year</div>
  <div class="year-nav">
    <button id="prevYearBtn">&#8592;</button>
    <div class="year-title" id="yearTitle">—</div>
    <button id="nextYearBtn">&#8594;</button>
  </div>
  <div class="streak-row" id="streakRow"></div>
  <div class="year-summary" id="yearSummary"></div>
  <div id="yearGrid"></div>
  <div class="year-legend" id="yearLegend"></div>

  <div class="save-note">Saved automatically to this browser</div>
</div>

<script>
function showToast(msg, isError) {
  let wrap = document.getElementById('toastWrap');
  if (!wrap) {
    wrap = document.createElement('div');
    wrap.id = 'toastWrap';
    wrap.className = 'toast-wrap';
    document.body.appendChild(wrap);
  }
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' err' : '');
  t.textContent = msg;
  wrap.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 250);
  }, 1700);
}

const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PLAN_KEY = 'workout_plan';
const LOG_KEY = 'workout_log';
const STREAK_KEY = 'hub_streak_days';

let plan = {};
let log = {};
let viewYear = new Date().getFullYear();

function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function recordActivity() {
  try {
    const days = JSON.parse(localStorage.getItem(STREAK_KEY) || '[]');
    const today = todayStr();
    if (days[days.length - 1] !== today) {
      days.push(today);
      localStorage.setItem(STREAK_KEY, JSON.stringify(days));
    }
  } catch (e) { /* non-critical */ }
}

function loadData() {
  try {
    const rawPlan = localStorage.getItem(PLAN_KEY);
    plan = rawPlan ? JSON.parse(rawPlan) : {};
  } catch (e) { plan = {}; }
  try {
    const rawLog = localStorage.getItem(LOG_KEY);
    log = rawLog ? JSON.parse(rawLog) : {};
  } catch (e) { log = {}; }
}

function savePlan() {
  localStorage.setItem(PLAN_KEY, JSON.stringify(plan));
}
function saveLog() {
  localStorage.setItem(LOG_KEY, JSON.stringify(log));
}

function renderToday() {
  const now = new Date();
  const dayIdx = now.getDay();
  const dateKey = todayStr();
  const workoutName = plan[dayIdx] || '';

  document.getElementById('todayDay').textContent = DAY_NAMES[dayIdx] + ' · Today';
  document.getElementById('todayWorkout').textContent = workoutName || 'Nothing planned yet';

  const entry = log[dateKey];
  const btn = document.getElementById('todayBtn');
  const isDone = !!(entry && entry.done);
  btn.textContent = isDone ? 'Done ✓' : 'Mark today done';
  btn.className = 'today-btn' + (isDone ? ' done' : '');

  btn.onclick = () => {
    const nowDone = !(log[dateKey] && log[dateKey].done);
    log[dateKey] = { done: nowDone, workout: workoutName };
    saveLog();
    if (nowDone) recordActivity();
    renderToday();
    renderHistory();
    renderYear();
    showToast(nowDone ? (workoutName ? workoutName + ' done ✓' : 'Marked done') : 'Unmarked');
  };
}

function renderPlan() {
  const container = document.getElementById('planList');
  container.innerHTML = '';
  const todayIdx = new Date().getDay();

  for (let i = 0; i < 7; i++) {
    const row = document.createElement('div');
    row.className = 'plan-row' + (i === todayIdx ? ' is-today' : '');
    row.innerHTML = `
      <div class="plan-day">${DAY_NAMES[i].slice(0,3)}</div>
      <input class="plan-input" type="text" placeholder="e.g. Biceps, Legs, Rest" value="${(plan[i] || '').replace(/"/g,'&quot;')}" data-day="${i}">
    `;
    container.appendChild(row);
  }

  container.querySelectorAll('.plan-input').forEach(input => {
    input.addEventListener('input', () => {
      const day = input.getAttribute('data-day');
      plan[day] = input.value;
      savePlan();
      if (Number(day) === todayIdx) renderToday();
    });
  });
}

function renderHistory() {
  const container = document.getElementById('historyList');
  container.innerHTML = '';

  const days = [];
  for (let i = 0; i < 14; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    days.push(`${y}-${m}-${day}`);
  }

  const hasAny = days.some(d => log[d]);
  if (!hasAny) {
    container.innerHTML = '<div class="empty">No sessions yet — mark today done to start your log.</div>';
    return;
  }

  days.forEach(dateKey => {
    const entry = log[dateKey];
    if (!entry) return;
    const d = new Date(dateKey + 'T00:00:00');
    const label = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    const row = document.createElement('div');
    row.className = 'history-row';
    row.innerHTML = `
      <div class="history-left">
        <div class="history-date">${label}</div>
        <div class="history-workout">${entry.workout || 'No workout set'}</div>
      </div>
      <div class="history-dot ${entry.done ? 'done' : ''}"></div>
    `;
    container.appendChild(row);
  });
}

function daysInMonth(y, m) {
  return new Date(y, m + 1, 0).getDate();
}

const WORKOUT_PALETTE = ['#4ade80','#60a5fa','#f87171','#facc15','#c084fc','#fb923c','#2dd4bf','#f472b6'];
function colorForWorkout(name) {
  const clean = (name || 'Workout').trim() || 'Workout';
  let hash = 0;
  for (let i = 0; i < clean.length; i++) {
    hash = (hash * 31 + clean.charCodeAt(i)) >>> 0;
  }
  return WORKOUT_PALETTE[hash % WORKOUT_PALETTE.length];
}

function computeCurrentStreak() {
  const todayKey = todayStr();
  let cur = 0;
  const cursor = new Date(todayKey + 'T00:00:00');
  const todayEntry = log[todayKey];
  if (!(todayEntry && todayEntry.done)) cursor.setDate(cursor.getDate() - 1);
  let safety = 0;
  while (safety < 3650) {
    const key = `${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}-${String(cursor.getDate()).padStart(2,'0')}`;
    const e = log[key];
    if (e && e.done) {
      cur++;
      cursor.setDate(cursor.getDate() - 1);
      safety++;
    } else break;
  }
  return cur;
}

function computeLongestStreakInYear(year, todayKey) {
  let longest = 0, run = 0;
  for (let m = 0; m < 12; m++) {
    const nd = daysInMonth(year, m);
    for (let d = 1; d <= nd; d++) {
      const dateKey = `${year}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if (dateKey > todayKey) break;
      const entry = log[dateKey];
      if (entry && entry.done) {
        run++;
        if (run > longest) longest = run;
      } else {
        run = 0;
      }
    }
  }
  return longest;
}

function renderYear() {
  document.getElementById('yearTitle').textContent = String(viewYear);

  const now = new Date();
  document.getElementById('nextYearBtn').disabled = viewYear >= now.getFullYear();

  const todayKey = todayStr();
  const grid = document.getElementById('yearGrid');
  grid.innerHTML = '';

  let doneCount = 0;
  let loggedDaysSoFar = 0;
  const workoutsSeen = new Set();

  for (let m = 0; m < 12; m++) {
    const numDays = daysInMonth(viewYear, m);
    const block = document.createElement('div');
    block.className = 'month-block';

    const label = document.createElement('div');
    label.className = 'month-block-label';
    label.textContent = MONTH_SHORT[m];
    block.appendChild(label);

    const dayGrid = document.createElement('div');
    dayGrid.className = 'day-grid';

    for (let d = 1; d <= numDays; d++) {
      const dateKey = `${viewYear}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isFuture = dateKey > todayKey;
      const isToday = dateKey === todayKey;
      const entry = log[dateKey];
      const isDone = !!(entry && entry.done);

      const cell = document.createElement('div');
      cell.className = 'day-cell'
        + (isDone ? ' done' : (isFuture ? ' future' : ' missed'))
        + (isToday ? ' is-today' : '');

      if (isDone) {
        const workoutName = entry.workout || 'Workout';
        cell.style.background = colorForWorkout(workoutName);
        workoutsSeen.add(workoutName);
      }

      if (!isFuture) {
        loggedDaysSoFar++;
        if (isDone) doneCount++;
        cell.addEventListener('click', () => {
          const d2 = new Date(dateKey + 'T00:00:00');
          const dLabel = d2.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
          const msg = isDone
            ? `${dLabel}: ${entry.workout || 'Workout'} \u2014 done`
            : `${dLabel}: no session logged`;
          showToast(msg);
        });
      }

      dayGrid.appendChild(cell);
    }

    block.appendChild(dayGrid);
    grid.appendChild(block);
  }

  const summary = document.getElementById('yearSummary');
  if (loggedDaysSoFar === 0) {
    summary.textContent = '';
  } else {
    summary.innerHTML = `<strong>${doneCount}</strong> of ${loggedDaysSoFar} days trained${viewYear === now.getFullYear() ? ' so far' : ''}`;
  }

  const streakRow = document.getElementById('streakRow');
  const currentStreak = computeCurrentStreak();
  const bestStreak = computeLongestStreakInYear(viewYear, todayKey);
  streakRow.innerHTML = `
    <div class="streak-box">
      <div class="streak-label">Current streak</div>
      <div class="streak-value">${currentStreak}</div>
    </div>
    <div class="streak-box">
      <div class="streak-label">Best this year</div>
      <div class="streak-value">${bestStreak}</div>
    </div>
  `;

  const legendEl = document.getElementById('yearLegend');
  if (workoutsSeen.size === 0) {
    legendEl.innerHTML = '';
  } else {
    legendEl.innerHTML = [...workoutsSeen].sort().map(w =>
      `<div class="year-legend-item"><span class="year-legend-dot" style="background:${colorForWorkout(w)}"></span>${w}</div>`
    ).join('');
  }
}

document.getElementById('prevYearBtn').addEventListener('click', () => {
  viewYear--;
  renderYear();
});
document.getElementById('nextYearBtn').addEventListener('click', () => {
  if (viewYear < new Date().getFullYear()) {
    viewYear++;
    renderYear();
  }
});

(function init() {
  loadData();
  renderToday();
  renderPlan();
  renderHistory();
  renderYear();
})();
</script>
</body>
</html>
