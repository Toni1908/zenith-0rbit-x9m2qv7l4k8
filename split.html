

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:      #080808;
    --surface: #101010;
    --border:  #1c1c1c;
    --text:    #e0e0e0;
    --muted:   #444;
    --accent:  #f87171;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px 60px;
  }
  .wrap { width: 100%; max-width: 460px; }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #555;
    text-decoration: none;
  }
  .back-link:hover { color: var(--text); }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .sound-toggle {
    background: none;
    border: none;
    font-size: 16px;
    color: #555;
    cursor: pointer;
    padding: 2px 4px;
    line-height: 1;
  }
  .sound-toggle:hover { color: #aaa; }

  .header {
    text-align: center;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .header-eyebrow {
    font-size: 10px;
    letter-spacing: 5px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .header-name {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: #fff;
  }

  .section-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .today-card {
    background: linear-gradient(180deg, #141414, #0f0f0f);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 26px;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .today-card.complete {
    border-color: #4ade80;
    box-shadow: 0 0 0 1px rgba(74,222,128,0.2), 0 0 22px rgba(74,222,128,0.12);
  }
  .today-bar {
    width: 100%;
    height: 5px;
    background: #1c1c1c;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 12px;
  }
  .today-bar-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--accent);
    transition: width 0.3s ease, background 0.3s ease;
  }
  .today-card.complete .today-bar-fill { background: #4ade80; }
  .today-day { font-size: 12px; color: #888; letter-spacing: 0.5px; }
  .today-workout { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .today-sets { font-size: 11px; color: #666; margin-top: 4px; }
  .today-btn {
    width: 100%;
    margin-top: 14px;
    padding: 11px 0;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #161616;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
  }
  .today-btn.done {
    background: rgba(74,222,128,0.12);
    border-color: #4ade80;
    color: #4ade80;
  }
  .today-btn:hover { border-color: #333; }
  .today-btn.done:hover { border-color: #4ade80; }

  /* ===== Program ===== */
  .program-notes {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: #aaa;
    font-family: inherit;
    font-size: 12px;
    line-height: 1.5;
    padding: 12px 14px;
    margin-bottom: 16px;
    resize: vertical;
    min-height: 54px;
  }
  .program-notes:focus { outline: none; border-color: #444; color: var(--text); }
  .program-notes::placeholder { color: #444; }

  .day-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    margin-bottom: 16px;
    padding-bottom: 2px;
  }
  .day-tab {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    color: #555;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  .day-tab.has-data { color: #ccc; }
  .day-tab.is-today { border-color: var(--accent); }
  .day-tab.active { background: #1a1a1a; border-color: #444; color: #fff; }

  .day-label-row { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; }
  .day-label-input {
    flex: 1;
    background: #0d0d0d;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 9px 12px;
  }
  .day-label-input:focus { outline: none; border-color: #444; }
  .day-label-input::placeholder { color: #555; }
  .day-remove-btn {
    flex-shrink: 0;
    background: transparent;
    border: 1px solid var(--border);
    color: #666;
    font-family: inherit;
    font-size: 10.5px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;

  }
  .day-remove-btn:hover { border-color: #e2574f; color: #e2574f; }

  .rest-note {
    text-align: center;
    color: #555;
    font-size: 12px;
    padding: 20px 0 26px;
  }

  .exercise-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .exercise-top {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
  }
  .exercise-name-input {
    flex: 1;
    min-width: 0;
    background: #0d0d0d;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    padding: 8px 10px;

  .exercise-tag-select {

    flex-shrink: 0;

    color: #555;
    font-size: 18px;

  .exercise-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .exercise-field { flex: 1; min-width: 0; }
  .exercise-field-label {
    font-size: 9px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .exercise-field-input {
    width: 100%;
    background: #0d0d0d;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 12.5px;
    padding: 7px 9px;

  .exercise-field-input:focus { outline: none; border-color: #444; }
  .exercise-field-input::placeholder { color: #555; }

  .exercise-notes {
    width: 100%;
    background: #0d0d0d;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: #999;
    font-family: inherit;
    font-size: 11.5px;
    line-height: 1.5;

  .exercise-notes::placeholder { color: #444; }

  .exercise-target-row { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: #666; }
  .exercise-target-input {

    background: #0d0d0d;

    border-radius: 5px;

    display: flex;
    align-items: center;

    background: #0d0d0d;

  .set-counter-label { font-size: 10px; color: #777; letter-spacing: 0.5px; }
  .set-counter-value { font-size: 13px; font-weight: 800; color: var(--text); min-width: 30px; text-align: center; transition: color 0.2s ease; }
  .set-counter.complete { border-color: #4ade80; }
  .set-counter.complete .set-counter-value { color: #4ade80; }

    70% { box-shadow: 0 0 0 9px rgba(255,255,255,0); }

    background: transparent;
    border: 1px dashed var(--border);
    color: #666;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;

    border-radius: 8px;

    margin-bottom: 26px;

  .history-row {
    display: flex;
    align-items: center;
    justify-content: space-between;

    border: 1px solid var(--border);

    padding: 9px 14px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .year-nav button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 32px; height: 32px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;

  .year-nav button:hover { border-color: #333; }
  .year-nav button:disabled { opacity: 0.3; cursor: default; }
  .year-title { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }

  .year-summary {
    text-align: center;
    font-size: 12px;
    color: #888;
    margin-bottom: 18px;
  }
  .year-summary strong { color: #4ade80; font-weight: 700; }

  .streak-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .streak-box {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 8px;
    text-align: center;
  }
  .streak-label {
    font-size: 9px;
    color: #777;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .streak-value {
    font-size: 19px;
    font-weight: 800;
    color: #4ade80;
    margin-top: 3px;
  }

  .month-block { margin-bottom: 0; }
  .month-block-label {
    font-size: 9px;
    color: #777;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .day-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .day-cell {
    aspect-ratio: 1;
    border-radius: 2px;
    background: var(--border);
  }
  .day-cell.done { cursor: pointer; }
  .day-cell.missed { cursor: pointer; }
  .day-cell.missed:hover { background: #262626; }
  .day-cell.done:hover { filter: brightness(1.2); }
  .day-cell.future { background: transparent; border: 1px dashed #1c1c1c; }
  .day-cell.is-today { box-shadow: 0 0 0 1.5px #fff inset; }

  #yearGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 16px 10px;
  }

  .year-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    margin: 16px 0 20px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .year-legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #aaa;
  }
  .year-legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  /* ===== shared polish ===== */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  body { animation: fadeInUp 0.35s ease; }
  body {
    padding-top: calc(env(safe-area-inset-top, 0px));
    padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px));
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #333; }
  * { scrollbar-width: thin; scrollbar-color: #262626 transparent; }

  button, a.card, .card {
    transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease, color 0.15s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.96); }
  a.card:active, .card:active { transform: scale(0.98); }

  .toast-wrap {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    pointer-events: none;
  }
  .toast {
    background: #161616;
    border: 1px solid #2a2a2a;
    color: #eee;
    font-size: 12px;
    font-weight: 500;
    padding: 9px 16px;
    border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.err { border-color: #e2574f; color: #f2a09c; }

</style>

<script>
function showToast(msg, isError) {
  let wrap = document.getElementById('toastWrap');
  if (!wrap) {
    wrap = document.createElement('div');
    wrap.id = 'toastWrap';
    wrap.className = 'toast-wrap';
    document.body.appendChild(wrap);
  }
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' err' : '');
  t.textContent = msg;
  wrap.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 250);
  }, 1700);
}

const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PROGRAM_KEY = 'workout_program';
const SESSION_KEY = 'workout_session';
const LOG_KEY = 'workout_log';
const SOUND_KEY = 'hub_sound_muted';

let soundMuted = localStorage.getItem(SOUND_KEY) === 'true';
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTone({ freq = 440, freqEnd = null, duration = 0.12, type = 'sine', volume = 0.18, delay = 0 }) {
  if (soundMuted) return;
  try {
    const ctx = getAudioCtx();
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, t0 + duration);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(volume, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  } catch (e) {}
}

function playClick() {
  if (soundMuted) return;
  try {
    const ctx = getAudioCtx();
    const t0 = ctx.currentTime;
    const bufferSize = Math.floor(ctx.sampleRate * 0.03);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'highpass';
    noiseFilter.frequency.value = 2200;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.5, t0);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.03);
    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(ctx.destination);
    noise.start(t0);

    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, t0);
    osc.frequency.exponentialRampToValueAtTime(90, t0 + 0.05);
    const oscGain = ctx.createGain();
    oscGain.gain.setValueAtTime(0.22, t0);
    oscGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.06);
    osc.connect(oscGain);
    oscGain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.08);
  } catch (e) {}
}

function playComplete() {
  playTone({ freq: 523.25, duration: 0.15, type: 'sine', volume: 0.16, delay: 0 });
  playTone({ freq: 659.25, duration: 0.15, type: 'sine', volume: 0.16, delay: 0.09 });
  playTone({ freq: 783.99, duration: 0.28, type: 'sine', volume: 0.18, delay: 0.18 });
}

function playUndo() {
  playTone({ freq: 300, freqEnd: 150, duration: 0.12, type: 'triangle', volume: 0.13 });
}

function updateSoundIcon() {
  const btn = document.getElementById('soundToggle');
  if (btn) btn.textContent = soundMuted ? '\u{1F507}' : '\u{1F50A}';
}

let program = {};
let session = {};
let log = {};
let viewYear = new Date().getFullYear();
let selectedDay = new Date().getDay();

const DEFAULT_PROGRAM = {
  notes: "2-Week Foundation Program — Week 1: You 3–4 RIR / Her 4+ RIR, mostly 2 sets, no failure. Week 2: You 2–3 RIR / Her 3–4 RIR. Goal is learning, not exhausting yourselves.",
  days: {

function uid() {
  return 'ex_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
}

function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function loadData() {
  try {
    const rawLog = localStorage.getItem(LOG_KEY);
    log = rawLog ? JSON.parse(rawLog) : {};
  } catch (e) { log = {}; }
}
function saveLog() {
  localStorage.setItem(LOG_KEY, JSON.stringify(log));
}

function loadProgram() {
  try {
    const raw = localStorage.getItem(PROGRAM_KEY);
    program = raw ? JSON.parse(raw) : null;
  } catch (e) { program = null; }
  if (!program) {
    program = JSON.parse(JSON.stringify(DEFAULT_PROGRAM));
    saveProgram();
  }
  if (!program.days) program.days = {};
  if (typeof program.notes !== 'string') program.notes = '';
}
function saveProgram() {
  localStorage.setItem(PROGRAM_KEY, JSON.stringify(program));
}

function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    session = raw ? JSON.parse(raw) : {};
  } catch (e) { session = {}; }
}
function saveSession() {
  localStorage.setItem(SESSION_KEY, JSON.stringify(session));
}
function getTodaySession() {
  const key = todayStr();
  if (!session[key]) session[key] = {};
  return session[key];
}

function tagColor(tag) {
  if (tag === 'Accessory') return '#c084fc';
  if (tag === 'Core') return '#facc15';
  return '#60a5fa';
}

function isDayFullyLogged(dayData, todaySession) {
  if (!dayData || !dayData.exercises.length) return false;
  let total = 0, done = 0;
  dayData.exercises.forEach(ex => {
    total += (ex.target || 0);
    done += Math.min(todaySession[ex.id] || 0, ex.target || 0);
  });
  return total > 0 && done >= total;
}

function renderToday() {
  const now = new Date();
  const dayIdx = now.getDay();
  const dateKey = todayStr();
  const dayData = program.days[dayIdx];
  const workoutName = dayData ? (dayData.label || 'Untitled day') : '';

  document.getElementById('todayDay').textContent = DAY_NAMES[dayIdx] + ' · Today';
  document.getElementById('todayWorkout').textContent = workoutName || 'Rest day';

  const setsEl = document.getElementById('todaySets');
  const todayCard = document.getElementById('todayCard');
  const barWrap = document.getElementById('todayBar');
  const barFill = document.getElementById('todayBarFill');
  if (dayData && dayData.exercises.length) {
    const todaySession = getTodaySession();
    let done = 0, total = 0;
    dayData.exercises.forEach(ex => {
      total += (ex.target || 0);
      done += Math.min(todaySession[ex.id] || 0, ex.target || 0);
    });
    setsEl.textContent = total > 0 ? `${done}/${total} sets logged` : '';
    if (total > 0) {
      barWrap.style.display = 'block';
      barFill.style.width = Math.round((done / total) * 100) + '%';
      todayCard.classList.toggle('complete', done >= total);
    } else {
      barWrap.style.display = 'none';
      todayCard.classList.remove('complete');
    }
  } else {
    setsEl.textContent = '';
    barWrap.style.display = 'none';
    todayCard.classList.remove('complete');
  }

  const entry = log[dateKey];
  const btn = document.getElementById('todayBtn');
  const isDone = !!(entry && entry.done);
  btn.textContent = isDone ? 'Done ✓' : 'Mark today done';
  btn.className = 'today-btn' + (isDone ? ' done' : '');

  btn.onclick = () => {
    const nowDone = !(log[dateKey] && log[dateKey].done);
    log[dateKey] = { done: nowDone, workout: workoutName };
    saveLog();
    if (nowDone) { playClick(); playComplete(); } else { playUndo(); }
    renderToday();
    renderHistory();
    renderYear();
    showToast(nowDone ? (workoutName ? workoutName + ' done ✓' : 'Marked done') : 'Unmarked');
  };
}

function renderDayTabs() {
  const container = document.getElementById('dayTabs');
  container.innerHTML = '';
  const todayIdx = new Date().getDay();

  for (let i = 0; i < 7; i++) {
    const hasData = !!program.days[i];
    const btn = document.createElement('button');
    btn.className = 'day-tab'
      + (hasData ? ' has-data' : '')
      + (i === todayIdx ? ' is-today' : '')
      + (i === selectedDay ? ' active' : '');
    btn.textContent = DAY_NAMES[i].slice(0, 3);
    btn.addEventListener('click', () => {
      if (!program.days[i]) {
        program.days[i] = { label: '', exercises: [] };
        saveProgram();
      }
      selectedDay = i;
      renderDayTabs();
      renderDayEditor();
    });
    container.appendChild(btn);
  }
}

function renderDayEditor() {
  const wrap = document.getElementById('dayEditor');
  const dayData = program.days[selectedDay];

  if (!dayData) {
    wrap.innerHTML = '<div class="rest-note">Rest day — tap a day above to view or plan it.</div>';
    return;
  }

  const isToday = selectedDay === new Date().getDay();
  wrap.innerHTML = `
    <div class="day-label-row">
      <input class="day-label-input" id="dayLabelInput" placeholder="Day focus e.g. Chest + Triceps + Core" value="${(dayData.label || '').replace(/"/g, '&quot;')}">
      <button class="day-remove-btn" id="dayRemoveBtn">Remove day</button>
    </div>
    <div id="exerciseList"></div>
    <button class="add-exercise-btn" id="addExerciseBtn">+ Add exercise</button>
  `;

  document.getElementById('dayLabelInput').addEventListener('input', (e) => {
    dayData.label = e.target.value;
    saveProgram();
    renderDayTabs();
    if (isToday) renderToday();
  });

  document.getElementById('dayRemoveBtn').addEventListener('click', () => {
    delete program.days[selectedDay];
    saveProgram();
    renderDayTabs();
    renderDayEditor();
    if (isToday) renderToday();
    showToast('Day cleared');
  });

  document.getElementById('addExerciseBtn').addEventListener('click', () => {
    dayData.exercises.push({ id: uid(), name: '', tag: 'Main', you: '', her: '', notes: '', target: 2 });
    saveProgram();
    renderExerciseList();
  });

  renderExerciseList();
}

function renderExerciseList() {
  const dayData = program.days[selectedDay];
  const container = document.getElementById('exerciseList');
  if (!dayData || !container) return;
  container.innerHTML = '';
  const isToday = selectedDay === new Date().getDay();
  const todaySession = isToday ? getTodaySession() : null;

  dayData.exercises.forEach(ex => {
    const card = document.createElement('div');
    card.className = 'exercise-card';
    card.style.borderLeft = '3px solid ' + tagColor(ex.tag);

    const count = todaySession ? (todaySession[ex.id] || 0) : 0;
    const target = ex.target || 0;
    const complete = isToday && target > 0 && count >= target;

    card.innerHTML = `
      <div class="exercise-top">
        <input class="exercise-name-input" placeholder="Exercise name" value="${(ex.name || '').replace(/"/g, '&quot;')}" data-field="name">
        <select class="exercise-tag-select" data-field="tag">
          <option value="Main" ${ex.tag === 'Main' ? 'selected' : ''}>Main</option>
          <option value="Accessory" ${ex.tag === 'Accessory' ? 'selected' : ''}>Accessory</option>
          <option value="Core" ${ex.tag === 'Core' ? 'selected' : ''}>Core</option>
        </select>
        <button class="exercise-remove-btn" title="Remove exercise">&times;</button>
      </div>
      <div class="exercise-row">
        <div class="exercise-field">
          <div class="exercise-field-label">You</div>
          <input class="exercise-field-input" placeholder="2 × 8–12" value="${(ex.you || '').replace(/"/g, '&quot;')}" data-field="you">
        </div>
        <div class="exercise-field">
          <div class="exercise-field-label">Her</div>
          <input class="exercise-field-input" placeholder="2 × 10–15" value="${(ex.her || '').replace(/"/g, '&quot;')}" data-field="her">
        </div>
      </div>
      <textarea class="exercise-notes" placeholder="Cues / form notes">${ex.notes || ''}</textarea>
      <div class="exercise-bottom">
        <div class="exercise-target-row">
          Target sets
          <input class="exercise-target-input" type="number" min="0" max="20" value="${target}" data-field="target">
        </div>
        ${isToday
          ? `<div class="set-counter${complete ? ' complete' : ''}">
               <span class="set-counter-dot"></span>
               <span class="set-counter-label">Sets</span>
               <span class="set-counter-value">${count}/${target}</span>
             </div>`
          : ''}
      </div>
    `;

    card.querySelectorAll('[data-field]').forEach(input => {
      const field = input.getAttribute('data-field');
      if (field === 'notes') return;
      const evt = input.tagName === 'SELECT' ? 'change' : 'input';
      input.addEventListener(evt, () => {
        if (field === 'target') {
          ex.target = Math.max(0, parseInt(input.value, 10) || 0);
        } else {
          ex[field] = input.value;
        }
        saveProgram();
        if (field === 'target' && isToday) { renderExerciseList(); renderToday(); }
        if (field === 'tag') { card.style.borderLeft = '3px solid ' + tagColor(ex.tag); }
      });
    });

    const notesEl = card.querySelector('.exercise-notes');
    notesEl.addEventListener('input', () => {
      ex.notes = notesEl.value;
      saveProgram();
    });

    card.querySelector('.exercise-remove-btn').addEventListener('click', () => {
      dayData.exercises = dayData.exercises.filter(e => e.id !== ex.id);
      saveProgram();
      renderExerciseList();
      if (isToday) renderToday();
    });

    if (isToday) {
      const counterEl = card.querySelector('.set-counter');
      counterEl.addEventListener('click', () => {
        const s = getTodaySession();
        const t = ex.target || 0;
        const cur = s[ex.id] || 0;
        const wasComplete = isDayFullyLogged(dayData, s);
        s[ex.id] = t > 0 ? (cur + 1) % (t + 1) : 0;
        saveSession();
        playClick();
        const justCompletedExercise = t > 0 && s[ex.id] === t;
        if (justCompletedExercise) playComplete();
        counterEl.classList.add('pulse');
        const nowComplete = isDayFullyLogged(dayData, s);
        if (nowComplete && !wasComplete) {
          setTimeout(() => playComplete(), 280);
          showToast('Workout complete 🔥');
        }
        setTimeout(() => {
          renderExerciseList();
          renderToday();
        }, 160);
      });
    }

    container.appendChild(card);
  });
}

function renderHistory() {
  const container = document.getElementById('historyList');
  container.innerHTML = '';

  const days = [];
  for (let i = 0; i < 14; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    days.push(`${y}-${m}-${day}`);
  }

  const hasAny = days.some(d => log[d]);
  if (!hasAny) {
    container.innerHTML = '<div class="empty">No sessions yet — mark today done to start your log.</div>';
    return;
  }

  days.forEach(dateKey => {
    const entry = log[dateKey];
    if (!entry) return;
    const d = new Date(dateKey + 'T00:00:00');
    const label = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    const row = document.createElement('div');
    row.className = 'history-row';
    row.innerHTML = `
      <div class="history-left">
        <div class="history-date">${label}</div>
        <div class="history-workout">${entry.workout || 'No workout set'}</div>
      </div>
      <div class="history-dot ${entry.done ? 'done' : ''}"></div>
    `;
    container.appendChild(row);
  });
}

function daysInMonth(y, m) {
  return new Date(y, m + 1, 0).getDate();
}

const WORKOUT_PALETTE = ['#4ade80','#60a5fa','#f87171','#facc15','#c084fc','#fb923c','#2dd4bf','#f472b6'];
function colorForWorkout(name) {
  const clean = (name || 'Workout').trim() || 'Workout';
  let hash = 0;
  for (let i = 0; i < clean.length; i++) {
    hash = (hash * 31 + clean.charCodeAt(i)) >>> 0;
  }
  return WORKOUT_PALETTE[hash % WORKOUT_PALETTE.length];
}

function computeCurrentStreak() {
  const todayKey = todayStr();
  let cur = 0;
  const cursor = new Date(todayKey + 'T00:00:00');
  const todayEntry = log[todayKey];
  if (!(todayEntry && todayEntry.done)) cursor.setDate(cursor.getDate() - 1);
  let safety = 0;
  while (safety < 3650) {
    const key = `${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}-${String(cursor.getDate()).padStart(2,'0')}`;
    const e = log[key];
    if (e && e.done) {
      cur++;
      cursor.setDate(cursor.getDate() - 1);
      safety++;
    } else break;
  }
  return cur;
}

function computeLongestStreakInYear(year, todayKey) {
  let longest = 0, run = 0;
  for (let m = 0; m < 12; m++) {
    const nd = daysInMonth(year, m);
    for (let d = 1; d <= nd; d++) {
      const dateKey = `${year}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if (dateKey > todayKey) break;
      const entry = log[dateKey];
      if (entry && entry.done) {
        run++;
        if (run > longest) longest = run;
      } else {
        run = 0;
      }
    }
  }
  return longest;
}

function renderYear() {
  document.getElementById('yearTitle').textContent = String(viewYear);

  const now = new Date();
  document.getElementById('nextYearBtn').disabled = viewYear >= now.getFullYear();

  const todayKey = todayStr();
  const grid = document.getElementById('yearGrid');
  grid.innerHTML = '';

  let doneCount = 0;
  let loggedDaysSoFar = 0;
  const workoutsSeen = new Set();

  for (let m = 0; m < 12; m++) {
    const numDays = daysInMonth(viewYear, m);
    const block = document.createElement('div');
    block.className = 'month-block';

    const label = document.createElement('div');
    label.className = 'month-block-label';
    label.textContent = MONTH_SHORT[m];
    block.appendChild(label);

    const dayGrid = document.createElement('div');
    dayGrid.className = 'day-grid';

    for (let d = 1; d <= numDays; d++) {
      const dateKey = `${viewYear}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isFuture = dateKey > todayKey;
      const isToday = dateKey === todayKey;
      const entry = log[dateKey];
      const isDone = !!(entry && entry.done);

      const cell = document.createElement('div');
      cell.className = 'day-cell'
        + (isDone ? ' done' : (isFuture ? ' future' : ' missed'))
        + (isToday ? ' is-today' : '');

      if (isDone) {
        const workoutName = entry.workout || 'Workout';
        cell.style.background = colorForWorkout(workoutName);
        workoutsSeen.add(workoutName);
      }

      if (!isFuture) {
        loggedDaysSoFar++;
        if (isDone) doneCount++;
        cell.addEventListener('click', () => {
          const d2 = new Date(dateKey + 'T00:00:00');
          const dLabel = d2.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
          const msg = isDone
            ? `${dLabel}: ${entry.workout || 'Workout'} \u2014 done`
            : `${dLabel}: no session logged`;
          showToast(msg);
        });
      }

      dayGrid.appendChild(cell);
    }

    block.appendChild(dayGrid);
    grid.appendChild(block);
  }

  const summary = document.getElementById('yearSummary');
  if (loggedDaysSoFar === 0) {
    summary.textContent = '';
  } else {
    summary.innerHTML = `<strong>${doneCount}</strong> of ${loggedDaysSoFar} days trained${viewYear === now.getFullYear() ? ' so far' : ''}`;
  }

  const streakRow = document.getElementById('streakRow');
  const currentStreak = computeCurrentStreak();
  const bestStreak = computeLongestStreakInYear(viewYear, todayKey);
  streakRow.innerHTML = `
    <div class="streak-box">
      <div class="streak-label">Current streak</div>
      <div class="streak-value">${currentStreak}</div>
    </div>
    <div class="streak-box">
      <div class="streak-label">Best this year</div>
      <div class="streak-value">${bestStreak}</div>
    </div>
  `;

  const legendEl = document.getElementById('yearLegend');
  if (workoutsSeen.size === 0) {
    legendEl.innerHTML = '';
  } else {
    legendEl.innerHTML = [...workoutsSeen].sort().map(w =>
      `<div class="year-legend-item"><span class="year-legend-dot" style="background:${colorForWorkout(w)}"></span>${w}</div>`
    ).join('');
  }
}

document.getElementById('prevYearBtn').addEventListener('click', () => {
  viewYear--;
  renderYear();
});
document.getElementById('nextYearBtn').addEventListener('click', () => {
  if (viewYear < new Date().getFullYear()) {
    viewYear++;
    renderYear();
  }
});

(function init() {
  loadData();
  loadProgram();
  loadSession();
  selectedDay = new Date().getDay();

  updateSoundIcon();
  document.getElementById('soundToggle').addEventListener('click', () => {
    soundMuted = !soundMuted;
    localStorage.setItem(SOUND_KEY, String(soundMuted));
    updateSoundIcon();
    if (!soundMuted) playTone({ freq: 660, duration: 0.08, volume: 0.12 });
  });

  document.getElementById('programNotes').value = program.notes || '';
  document.getElementById('programNotes').addEventListener('input', (e) => {
    program.notes = e.target.value;
    saveProgram();
  });

  renderToday();
  renderDayTabs();
  renderDayEditor();
  renderHistory();
  renderYear();
})();
</script>
